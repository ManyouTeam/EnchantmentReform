enabled: true
# Leave empty to allow opening without an additional permission.
permission: ''

title: '{lang:attribute-menu-title} &8• &7{page}/{pages}'
layout:
  - 'FFFFFFFFF'
  - 'FAAAAAAAF'
  - 'FAAAAAAAF'
  - 'FAAAAAAAF'
  - 'FAAAAAAAF'
  - 'PFFFIHFFN'

contents:
  A:
    type: attributes
    mode: information
    item:
      material: AMETHYST_SHARD
      name: '&d&l{name} &8• &f{value}'
      lore:
        - '{lang:attribute-menu-category}'
        - ' '
        - '{lang:attribute-current-effect}'
        - '&7{current_description}'
        - ' '
        - '{lang:attribute-next-effect}'
        - '&7{next_description}'
        - ' '
        - '{lang:attribute-detail-base-value}'
        - '{lang:attribute-detail-final-value}'
        - '{lang:attribute-menu-modifier-count}'
        - ' '
        - '{lang:attribute-menu-click}'
    click-actions:
      LEFT:
        open:
          type: open_attribute

items:
  F:
    item:
      material: PURPLE_STAINED_GLASS_PANE
      name: ' '
  P:
    hide-on-first-page: true
    item:
      material: ARROW
      name: '{lang:attribute-detail-previous}'
    hidden-item:
      material: PURPLE_STAINED_GLASS_PANE
      name: ' '
    actions:
      page:
        type: previous_page
  I:
    item:
      material: BOOK
      name: '{lang:attribute-menu-overview}'
      lore:
        - '{lang:attribute-menu-overview-description}'
        - '{lang:attribute-menu-overview-values}'
  H:
    item:
      material: COMPASS
      name: '{lang:menu-back-main}'
    actions:
      open:
        type: open_menu
        menu: main
  N:
    hide-on-last-page: true
    item:
      material: ARROW
      name: '{lang:attribute-detail-next}'
    hidden-item:
      material: PURPLE_STAINED_GLASS_PANE
      name: ' '
    actions:
      page:
        type: next_page
