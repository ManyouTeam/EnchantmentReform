enabled: true
# Leave empty to allow opening without an additional permission.
permission: ''

title: '{lang:skill-menu-title} &8• &7{page}/{pages}'
layout:
  - 'FFFFFFFFF'
  - 'FSSSSSSSF'
  - 'FSSSSSSSF'
  - 'FSSSSSSSF'
  - 'FSSSSSSSF'
  - 'PFFFIHFFN'

contents:
  S:
    type: skills
    use-skill-icon: true
    item:
      name: '&a&l{name} &8• &7Lv.{level}'
      lore:
        - '{lang:skill-menu-category}'
        - ' '
        - '&7{description}'
        - ' '
        - '{lang:skill-menu-experience-overview}'
        - '{lang:skill-menu-progress-overview}'
        - '{lang:skill-menu-sources-overview}'
        - ' '
        - '{lang:skill-menu-click-overview}'
    click-actions:
      LEFT:
        open:
          type: open_skill

items:
  F:
    item:
      material: BLACK_STAINED_GLASS_PANE
      name: ' '
  P:
    hide-on-first-page: true
    item:
      material: ARROW
      name: '{lang:attribute-detail-previous}'
    hidden-item:
      material: BLACK_STAINED_GLASS_PANE
      name: ' '
    actions:
      page:
        type: previous_page
  I:
    item:
      material: BOOK
      name: '{lang:skill-menu-overview}'
      lore:
        - '{lang:skill-menu-overview-description}'
        - '{lang:skill-menu-current-points}'
  H:
    item:
      material: COMPASS
      name: '{lang:menu-back-main}'
    actions:
      open:
        type: open_menu
        menu: main
  N:
    hide-on-last-page: true
    item:
      material: ARROW
      name: '{lang:attribute-detail-next}'
    hidden-item:
      material: BLACK_STAINED_GLASS_PANE
      name: ' '
    actions:
      page:
        type: next_page
