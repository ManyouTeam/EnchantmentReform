title: '{lang:skill-menu-title} &8• &7{page}/{pages}'
layout:
  - 'FFFFFFFFF'
  - 'FSSSSSSSF'
  - 'FSSSSSSSF'
  - 'FSSSSSSSF'
  - 'FSSSSSSSF'
  - 'PFFFIHFFN'

contents:
  S:
    type: skills
    use-skill-icon: true
    item:
      name: '&a&l{name} &8• &7Lv.{level}'
      lore:
        - '&8技能进度'
        - ' '
        - '&7{description}'
        - ' '
        - '&7经验：&f{experience}&8/&f{required_experience}'
        - '&7进度：{progress_bar} &a{progress}%'
        - '&7经验来源：&f{source_count}'
        - ' '
        - '&e▶ 点击查看经验来源与等级奖励'
    click-actions:
      LEFT:
        open:
          type: open_skill

items:
  F:
    item:
      material: BLACK_STAINED_GLASS_PANE
      name: ' '
  P:
    hide-on-first-page: true
    item:
      material: ARROW
      name: '&a上一页'
    hidden-item:
      material: BLACK_STAINED_GLASS_PANE
      name: ' '
    actions:
      page:
        type: previous_page
  I:
    item:
      material: BOOK
      name: '&b&l技能总览'
      lore:
        - '&7选择技能查看完整成长路线。'
        - '&7当前属性点：&e{points}'
  H:
    item:
      material: COMPASS
      name: '&b返回主菜单'
    actions:
      open:
        type: open_menu
        menu: main
  N:
    hide-on-last-page: true
    item:
      material: ARROW
      name: '&a下一页'
    hidden-item:
      material: BLACK_STAINED_GLASS_PANE
      name: ' '
    actions:
      page:
        type: next_page
