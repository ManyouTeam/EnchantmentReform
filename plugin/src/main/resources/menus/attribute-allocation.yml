title: '{lang:skill-allocation-title} &8• &7{page}/{pages}'
layout:
  - 'FFFFFFFFF'
  - 'FAAAAAAAF'
  - 'FAAAAAAAF'
  - 'FAAAAAAAF'
  - 'FAAAAAAAF'
  - 'PFFFIHFFN'

contents:
  A:
    type: attributes
    mode: allocation
    item:
      material: NETHER_STAR
      name: '&a&l{name} &8• &7{base_value}/{maximum_value}'
      lore:
        - '&8可升级属性'
        - ' '
        - '&f当前效果'
        - '&7{current_description}'
        - ' '
        - '&f升级后效果'
        - '&7{next_description}'
        - ' '
        - '&7等级变化：&f{base_value} &8→ &a{next_base}'
        - '&7最终值变化：&f{value} &8→ &a{next_value}'
        - '&7升级需要：&e{next_price} 属性点'
        - '{requirement}'
        - ' '
        - '&e▶ 点击进入升级与属性详情'
    click-actions:
      LEFT:
        open:
          type: open_attribute

items:
  F:
    item:
      material: GREEN_STAINED_GLASS_PANE
      name: ' '
  P:
    hide-on-first-page: true
    item:
      material: ARROW
      name: '&a上一页'
    hidden-item:
      material: GREEN_STAINED_GLASS_PANE
      name: ' '
    actions:
      page:
        type: previous_page
  I:
    item:
      material: SUNFLOWER
      name: '&e&l属性加点'
      lore:
        - '&7点击属性进入详情页面后升级。'
        - '&7价格按目标等级计算。'
        - ' '
        - '{lang:skill-menu-points}'
  H:
    item:
      material: COMPASS
      name: '&b返回主菜单'
    actions:
      open:
        type: open_menu
        menu: main
  N:
    hide-on-last-page: true
    item:
      material: ARROW
      name: '&a下一页'
    hidden-item:
      material: GREEN_STAINED_GLASS_PANE
      name: ' '
    actions:
      page:
        type: next_page
