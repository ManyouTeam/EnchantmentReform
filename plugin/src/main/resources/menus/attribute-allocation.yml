enabled: true
# Leave empty to allow opening without an additional permission.
permission: ''

title: '{lang:skill-allocation-title} &8• &7{page}/{pages}'
layout:
  - 'FFFFFFFFF'
  - 'FAAAAAAAF'
  - 'FAAAAAAAF'
  - 'FAAAAAAAF'
  - 'FAAAAAAAF'
  - 'PFFFIHFFN'

contents:
  A:
    type: attributes
    mode: allocation
    item:
      material: NETHER_STAR
      name: '&a&l{name} &8• &7{base_value}/{maximum_value}'
      lore:
        - '{lang:skill-allocation-category}'
        - ' '
        - '{lang:attribute-current-effect}'
        - '&7{current_description}'
        - ' '
        - '{lang:attribute-upgraded-effect}'
        - '&7{next_description}'
        - ' '
        - '{lang:attribute-detail-level-change}'
        - '{lang:attribute-detail-value-change}'
        - '{lang:skill-allocation-upgrade-cost}'
        - '{requirement}'
        - ' '
        - '{lang:skill-allocation-click-details}'
    click-actions:
      LEFT:
        open:
          type: open_attribute

items:
  F:
    item:
      material: GREEN_STAINED_GLASS_PANE
      name: ' '
  P:
    hide-on-first-page: true
    item:
      material: ARROW
      name: '{lang:attribute-detail-previous}'
    hidden-item:
      material: GREEN_STAINED_GLASS_PANE
      name: ' '
    actions:
      page:
        type: previous_page
  I:
    item:
      material: SUNFLOWER
      name: '{lang:main-menu-allocation-name}'
      lore:
        - '{lang:skill-allocation-info-description}'
        - '{lang:skill-allocation-info-price}'
        - ' '
        - '{lang:skill-menu-points}'
  H:
    item:
      material: COMPASS
      name: '{lang:menu-back-main}'
    actions:
      open:
        type: open_menu
        menu: main
  N:
    hide-on-last-page: true
    item:
      material: ARROW
      name: '{lang:attribute-detail-next}'
    hidden-item:
      material: GREEN_STAINED_GLASS_PANE
      name: ' '
    actions:
      page:
        type: next_page
