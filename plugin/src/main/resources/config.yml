      display-name: '{lang:supported-item-pickaxe}'
      tags: [enchantmentreform:pickaxe]
    SHOVEL:
      display-name: '{lang:supported-item-shovel}'
      tags: [enchantmentreform:shovel]
    HOE:
      display-name: '{lang:supported-item-hoe}'
      tags: [enchantmentreform:hoe]
    BOW:
      display-name: '{lang:supported-item-bow}'
      tags: [enchantmentreform:bow]
    CROSSBOW:
      display-name: '{lang:supported-item-crossbow}'
      tags: [enchantmentreform:crossbow]
    TRIDENT:
      display-name: '{lang:supported-item-trident}'
      tags: [enchantmentreform:trident]
    SPEAR:
      display-name: '{lang:supported-item-spear}'
      tags: [enchantmentreform:spear]
    FISHING_ROD:
      display-name: '{lang:supported-item-fishing-rod}'
      tags: [enchantmentreform:fishing_rod]
    SHIELD:
