        - '#enchantmentreform:trident'
    MELEE_WEAPON_AND_TRIDENT:
      key: enchantmentreform:melee_weapon_and_trident
      values:
        - '#enchantmentreform:melee_weapon'
        - '#enchantmentreform:trident'
    SPEAR:
      key: enchantmentreform:spear
      values:
        - '#minecraft:spears'
    ABSORPTION_WEAPON:
      key: enchantmentreform:absorption_weapon
      values:
        - '#enchantmentreform:sword'
        - '#enchantmentreform:spear'
        - '#enchantmentreform:trident'
        - '#enchantmentreform:bow'
    ALL_WEAPONS:
      key: enchantmentreform:all_weapons
      values:
        - '#minecraft:enchantable/weapon'
        - '#enchantmentreform:melee_weapon'
        - '#enchantmentreform:bow_and_crossbow'
        - '#enchantmentreform:trident'
    FISHING_ROD:
      key: enchantmentreform:fishing_rod
      values:
        - minecraft:fishing_rod
    SHIELD:
      key: enchantmentreform:shield
      values:
        - minecraft:shield
    ELYTRA:
      key: enchantmentreform:elytra
      values:
        - minecraft:elytra
    HELMET:
      key: enchantmentreform:helmet
      values:
        - '#minecraft:head_armor'
    CHESTPLATE:
      key: enchantmentreform:chestplate
      values:
        - '#minecraft:chest_armor'
    LEGGINGS:
      key: enchantmentreform:leggings
      values:
        - '#minecraft:leg_armor'
    BOOTS:
      key: enchantmentreform:boots
