      tags: [enchantmentreform:elytra]
    HELMET:
      display-name: '{lang:supported-item-helmet}'
      tags: [enchantmentreform:helmet]
    CHESTPLATE:
      display-name: '{lang:supported-item-chestplate}'
      tags: [enchantmentreform:chestplate]
    LEGGINGS:
      display-name: '{lang:supported-item-leggings}'
      tags: [enchantmentreform:leggings]
    BOOTS:
      display-name: '{lang:supported-item-boots}'
      tags: [enchantmentreform:boots]

powers:
  # SCAN checks every equipment slot for each trigger.
  # CACHE stores active equipment enchantments and updates them through Paper's
  # EntityEquipmentChangedEvent. CACHE falls back to SCAN when running on Spigot.
  active-enchantment-mode: SCAN
  strict-active-slot-check: true
  break-block:
    # Hard safety cap shared by every break_blocks ability.
    max-blocks-per-activation: 512
  # Restore blocks formed by configured minecraft:location_changed effects.
  location-changed-effect:
    auto-remove:
      enabled: true
      duration: 80~120
  temp-block-crack-animation:
    enabled: true
    start-at: 0.5
    update-interval: 5
    view-distance: 64
  cost-price:
    shulker-box-check: false
    # Support Value: Bukkit, ItemFormat.
    check-method: Bukkit
    item-format:
      ignore-key:
        - 'lore'
        - 'damage'
        - 'tool.damage-per-block'

# Skill definitions and XP sources are loaded from plugins/EnchantmentReform/skills/*.yml.
skills:
  experience-multipliers:
    # Every matching entry is multiplied together. Use '*' or 'all' to target all skills.
    # Player multipliers set by /enchantmentreform setskillmultiplier are multiplied afterwards.
    permissions:
      # vip:
      #   permission: 'enchantmentreform.skill-multiplier.vip'
      #   skills: ['*']
      #   multiplier: 1.5
      # mining-event:
      #   permission: 'enchantmentreform.skill-multiplier.mining-event'
      #   skills: [mining]
      #   multiplier: 2.0
  level-up-message: '{lang:skill-level-up}'
  feedback:
    experience:
      enabled: true
      # Prevents movement and rapid block breaks from producing feedback every tick.
      cooldown-ticks: 5
      # Supported modes: BOSS_BAR, ACTION_BAR, BOTH.
      display: BOSS_BAR
      actionbar: '[actionbar]{lang:skill-xp-gain}[/actionbar]'
      bossbar:
        title: '{lang:skill-xp-gain}'
        color: BLUE
        style: SOLID
      sound:
        name: 'minecraft:entity.experience_orb.pickup'
        volume: 0.25
        pitch: 1.35
    level-up:
      title: '[title=10,50,20]{lang:skill-level-up-title};;{lang:skill-level-up-subtitle}[/title]'
      sound:
        name: 'minecraft:ui.toast.challenge_complete'
        volume: 0.7
        pitch: 1.0
  allocation-messages:
    success: '{lang:skill-allocation-success}'
    not-enough-points: '{lang:skill-allocation-not-enough}'
    maximum-reached: '{lang:skill-allocation-maximum}'
    condition-not-met: '{lang:skill-allocation-condition-not-met}'
    invalid: '{lang:skill-allocation-invalid}'
