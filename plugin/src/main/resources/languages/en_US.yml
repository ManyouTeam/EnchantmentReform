  enchantment-adaptive_resistance-name: "Adaptive Resistance"
  enchantment-adaptive_resistance-description: '&8Consecutive damage of the same type within &a8 &8seconds is reduced by &a3% &8per stack, up to &a{max_stacks} &8stacks.'
  enchantment-auto_feed-name: "Auto Feed"
  enchantment-auto_feed-description: '&8Automatically eats when hunger falls to &a10 &8or lower; the threshold rises to &a18 &8when health is not full.'
  enchantment-auto_feed-trigger-message: '[actionbar]&6Auto Feed &7| &aAutomatically ate once[/actionbar]'
  enchantment-auto_purify-name: "Auto Purify"
  enchantment-auto_purify-description: '&8Removes one negative potion effect every &a{interval} &8seconds.'
  enchantment-auto_purify-trigger-message: '[actionbar]&6Auto Purify &7| &aAutomatically purified once[/actionbar]'
  enchantment-battle_spirit-name: "Battle Spirit"
  enchantment-battle_spirit-description: '&8Taking damage has a &a{trigger_chance}% &8chance to grant Strength I for &a{duration} &8seconds.'
  enchantment-biome_regeneration-name: "Biome Rejuvenation"
  enchantment-biome_regeneration-description: '&8Entering a new biome grants Regeneration I for &a5 &8seconds.'
  enchantment-double_jump-name: "Double Jump"
  enchantment-double_jump-description: '&8Allows a double jump while airborne and not sneaking every &a{cooldown} &8seconds.'
  enchantment-double_jump-cooldown-message: '[actionbar]&cDouble Jump will be ready in &4{remaining} &cseconds![/actionbar]'
  enchantment-double_jump-trigger-message: '[actionbar]&6Double Jump &7| &aTriggered once[/actionbar]'
  enchantment-emerald_refund-name: "Emerald Refund"
  enchantment-emerald_refund-description: '&8Completing a villager trade has a &a{refund_chance}% &8chance to refund the emeralds spent.'
  enchantment-piglin_barter-name: "Piglin Barter"
  enchantment-piglin_barter-description: '&8Bartering with a piglin has a &a{extra_chance}% &8chance for it to drop an extra random item after a short delay.'
  enchantment-piglin_barter-trigger-message: '&aPiglin Barter triggered: the piglin dropped an extra random item.'
  enchantment-end_walker-name: "End Walker"
  enchantment-end_walker-description: '&8Grants Speed {potion_level_roman} and Jump Boost {potion_level_roman} while in the End.'
  enchantment-ender_veil-name: "Ender Veil"
  enchantment-ender_veil-description: '&8Prevents Endermen from becoming hostile when you look directly at them.'
  enchantment-experience_evasion-name: "Experience Evasion"
  enchantment-experience_evasion-description: '&8When attacked by an entity, has a &a{dodge_chance}% &8chance to consume &a{experience_cost} &8experience points and evade all damage.'
  enchantment-experience_refund-name: "Experience Refund"
  enchantment-experience_refund-description: '&8Enchanting an item has a &a{refund_chance}% &8chance to refund &a{refund_ratio}% &8of the experience levels spent, at least 1.'
  enchantment-experience_refund-trigger-message: '&aExperience Refund triggered: refunded &e{refund_amount} &aexperience level(s).'
  enchantment-melee_dodge-name: "Melee Dodge"
  enchantment-melee_dodge-description: '&8Enables melee damage dodging. Its chance and sidestep strength are determined by the Dodge attribute.'
  enchantment-projectile_dodge-name: "Projectile Dodge"
  enchantment-projectile_dodge-description: '&8Enables projectile damage dodging. Its chance and sidestep strength are determined by the Dodge attribute.'
  enchantment-farmland_guard-name: "Farmland Guard"
  enchantment-farmland_guard-description: '&8Prevents farmland from turning into dirt when trampled.'
  enchantment-first_strike_guard-name: "First Strike Guard"
  enchantment-first_strike_guard-description: '&8Reduces the first attack from each monster by &a{damage_reduction_percentage}%&8, consuming armor durability based on the damage prevented.'
  enchantment-jump_boost-name: "Jump Boost"
  enchantment-jump_boost-description: '&8Increases jumping ability by &a{jump_power}%&8.'
  enchantment-knockback_resistance-name: "Steadfast"
  enchantment-knockback_resistance-description: '&8Increases knockback resistance by &a{knockback_resistance}%&8.'
  enchantment-lava_walker-name: "Lava Walker"
  enchantment-lava_walker-description: '&8While walking on the ground, converts nearby lava surfaces within &a{conversion_radius} &8blocks into magma blocks and prevents magma block damage.'
  enchantment-lapis_refund-name: "Lapis Refund"
  enchantment-lapis_refund-description: '&8Enchanting an item has a &a{refund_chance}% &8chance to refund up to &a{refund_amount} &8lapis lazuli, never more than was spent.'
  enchantment-magic_protection-name: "Magic Protection"
  enchantment-magic_protection-description: '&8Reduces magic and wither damage by &a{damage_reduction}%&8.'
  enchantment-magma_response-name: "Magma Response"
  enchantment-magma_response-description: '&8Taking magma damage grants Fire Resistance III for &a5 &8seconds; cooldown: &a{cooldown} &8seconds.'
  enchantment-nourishing_armor-name: "Nourishing Armor"
  enchantment-nourishing_armor-description: '&8Increases the hunger restored by food by &a{increase_percentage}%&8.'
  enchantment-phantom_guard-name: "Phantom Guard"
  enchantment-phantom_guard-description: '&8Prevents phantoms from spawning because of your insomnia while worn.'
  enchantment-piglin_disguise-name: "Piglin Disguise"
  enchantment-piglin_disguise-description: '&8Prevents piglins from becoming hostile because you are not wearing gold armor. Attacking or angering them still provokes them.'
  enchantment-potion_resistance-name: "Potion Resistance"
  enchantment-potion_resistance-description: '&8Has a &a{trigger_chance}% &8chance to resist an incoming negative potion effect.'
  enchantment-quick_reflexes-name: "Quick Reflexes"
  enchantment-quick_reflexes-description: '&8Taking damage has a &a{trigger_chance}% &8chance to grant Speed I for &a{duration} &8seconds.'
  enchantment-ranged_retribution-name: "Ranged Retribution"
  enchantment-ranged_retribution-description: '&8Reduces ranged damage by &a{damage_reduction_percentage}% &8and reflects the prevented damage to all monsters within &a6 &8blocks.'
  enchantment-retaliation-name: "Retaliation"
  enchantment-retaliation-description: '&8Taking entity damage marks the attacker for &a{retaliation_duration_seconds} &8seconds; melee damage dealt to it is increased by &a{bonus_damage_percentage}%&8.'
  enchantment-retaliation-mark-message: '[actionbar]&6Retaliation &7| &eAttacker marked for &f{retaliation_duration_seconds} &eseconds[/actionbar]'
  enchantment-retaliation-trigger-message: '[actionbar]&6Retaliation &7| &aDamage to the marked target increased by &f{bonus_damage_percentage}%[/actionbar]'
  enchantment-rebirth-name: "Rebirth"
  enchantment-rebirth-description: '&8Revives you at full health upon death, grants Resistance IV for &a3 &8seconds, and consumes this enchantment.'
  enchantment-safe_fall-name: "Safe Fall"
  enchantment-safe_fall-description: '&8Increases the safe fall distance by &a{safe_distance} &8blocks.'
  enchantment-shrewd_bargain-name: "Shrewd Bargain"
  enchantment-shrewd_bargain-description: '&8Provides &a25% &8more uses for villager trades; reopening the trading screen may sometimes be required to refresh them.'
  enchantment-sprint_efficiency-name: "Sprint Efficiency"
  enchantment-sprint_efficiency-description: '&8Reduces exhaustion from sprinting and sprint-jumping by &a{exhaustion_reduction}&8.'
  enchantment-step_assist-name: "Step Assist"
  enchantment-step_assist-description: '&8Increases automatic step height by &a{step_height} &8blocks.'
  enchantment-stronghold_locator-name: "Stronghold Locator"
  enchantment-stronghold_locator-description: '&8Sneak and right-click a block to locate a nearby stronghold.'
  enchantment-stronghold_locator-cooldown-message: '&cStronghold Locator is on cooldown for another &e{remaining} &cseconds.'
  enchantment-suffocation_escape-name: "Suffocation Escape"
  enchantment-suffocation_escape-description: '&8When taking suffocation damage, teleports you to a nearby safe location and costs this item &a10 &8durability.'
  enchantment-tempting_presence-name: "Tempting Presence"
  enchantment-tempting_presence-description: '&8Increases the distance from which creatures are tempted by &a{attraction_distance} &8blocks.'
  enchantment-vitality-name: "Vitality"
  enchantment-vitality-description: '&8Increases maximum health by &a{bonus_health} &8points.'
  enchantment-void_return-name: "Void Return"
  enchantment-void_return-description: '&8When void damage triggers, returns you to the current world spawn, prevents the damage, and consumes this enchantment.'
  enchantment-warden_concealment-name: "Warden Concealment"
  enchantment-warden_concealment-description: '&8Reduces the Warden anger you generate by &a50%&8, delaying its detection of you.'
  enchantment-silent_step-name: "Silent Step"
  enchantment-silent_step-description: '&8Has a &a{cancel_chance}% &8chance to cancel vibrations you create in the Deep Dark, preventing the Warden from being alerted.'
  enchantment-dictatorship_curse-name: "Dictatorship Curse"
  enchantment-dictatorship_curse-description: '&8Prevents all other non-vanilla, non-curse enchantments from taking effect.'
  enchantment-fragility_curse-name: "Fragility Curse"
  enchantment-fragility_curse-description: '&8Whenever this item loses durability, it has a &c5% &8chance to break immediately.'
  enchantment-gravity_curse-name: "Gravity Curse"
  enchantment-gravity_curse-description: '&8Adds &c{gravity} &8gravity, making the player fall faster.'
  enchantment-healing_curse-name: "Mercy Curse"
  enchantment-healing_curse-description: '&8Attacks against monsters deal no damage and instead heal them for the amount that would have been dealt.'
  enchantment-hunger_curse-name: "Hunger Curse"
  enchantment-hunger_curse-description: '&8Increases hunger consumption by &c{increase_percentage}%&8.'
  enchantment-auto_fish-name: "Auto Fishing"
  enchantment-auto_fish-description: '&8Automatically reels in and casts again when a fish bites.'
  enchantment-auto_fish-trigger-message: '[actionbar]&6Auto Fishing &7| &aAutomatically caught once[/actionbar]'
  enchantment-grappling_hook-name: "Grappling Hook"
  enchantment-grappling_hook-description: '&8Pulls you toward the fishing hook when it lands outside water.'
  enchantment-instant_cook-name: "Instant Cook"
  enchantment-instant_cook-description: '&8Raw fish caught while fishing is immediately converted into cooked fish.'
  enchantment-ocean_companion-name: "Ocean Companion"
  enchantment-ocean_companion-description: '&8After catching a fish in an ocean biome, has a &a15% &8chance to spawn a friendly sea creature nearby.'
  enchantment-storm_angler-name: "Storm Angler"
  enchantment-storm_angler-description: '&8During thunderstorms, hooking a creature summons lightning and deals 6 damage.'
  enchantment-absorption_harvest-name: "Soul Harvest"
  enchantment-absorption_harvest-description: '&8Increases maximum damage absorption by &a{absorption_limit} &8points; killing an enemy grants &a2 &8absorption health.'
  enchantment-butcher-name: "Butcher"
  enchantment-butcher-description: '&8Deals &a{bonus_damage} &8additional damage to passive animals.'
  enchantment-combo-name: "Combo"
  enchantment-combo-description: '&8Consecutive attacks within &a{time} &8seconds gain &a8% &8damage per stack, up to &a{max_stacks} &8stacks.'
  enchantment-end_bane-name: "End Bane"
  enchantment-end_bane-description: '&8Deals &a{bonus_damage} &8additional damage to creatures from the End.'
  enchantment-executioner-name: "Executioner"
  enchantment-executioner-description: '&8Axe attacks deal more damage as the target loses health, up to &a{max_damage_increase_percentage}% &8additional damage near death.'
  enchantment-full_health_strike-name: "Full Health Strike"
  enchantment-full_health_strike-description: '&8Deals &a{damage_increase_percentage}% &8more damage when attacking a creature near full health.'
  enchantment-inventory_shuffle_curse-name: "Inventory Shuffle Curse"
  enchantment-inventory_shuffle_curse-description: '&8Attacks have a &c25% &8chance to randomly shuffle the items in your inventory.'
  enchantment-nether_bane-name: "Nether Bane"
  enchantment-nether_bane-description: '&8Deals &a{bonus_damage} &8additional damage while in the Nether.'
  enchantment-rage-name: "Rage"
  enchantment-rage-description: '&8Taking damage builds rage for &a10 &8seconds. Each rage point increases your next attack by &a{damage}%&8, up to &a{max_stacks} &8stacks.'
  enchantment-sneak_attack-name: "Sneak Attack"
  enchantment-sneak_attack-description: '&8Swords deal &a{damage_increase_percentage}% &8more damage while sneaking.'
  enchantment-spawner_slayer-name: "Spawner Slayer"
  enchantment-spawner_slayer-description: '&8Deals &a{bonus_damage} &8additional damage to creatures spawned by spawners.'
  enchantment-trial_weakness-name: "Trial Intimidation"
  enchantment-trial_weakness-description: '&8The first attack against each monster in a trial chamber inflicts Weakness I for &a{duration} &8seconds.'
  enchantment-cobweb-name: "Cobweb"
  enchantment-cobweb-description: '&8Arrow hits have a &a{trigger_chance}% &8chance to create a cobweb lasting &a{duration} &8seconds.'
  enchantment-evoker_fangs-name: "Evoker Fangs"
  enchantment-evoker_fangs-description: '&8After an arrow hits a creature, summons a line of evoker fangs that each deal &a{fang_damage} &8damage.'
  enchantment-headshot-name: "Headshot"
  enchantment-headshot-description: '&8Projectiles that hit the target head deal &a{damage_increase_percentage}% &8more damage.'
  enchantment-point_blank-name: "Point Blank"
  enchantment-point_blank-description: '&8Deals &a{damage_increase_percentage}% &8more damage to targets within &a{distance} &8blocks.'
  enchantment-ricochet_bolt-name: "Ricochet Bolt"
  enchantment-ricochet_bolt-description: '&8Arrows ricochet from blocks up to &a{maximum_ricochets} &8times and travel at most &a{maximum_ricochet_distance} &8blocks after each bounce. Each ricochet adds &a{damage_bonus} &8bonus damage.'
  enchantment-meteor_cadence-name: "Meteor Cadence"
  enchantment-meteor_cadence-description: '&8Sneak while falling with this mace to gain &a{gravity_boost_percentage}% &8gravity, reduce air drag by &a{drag_reduction_percentage}%&8, and accelerate downward by &a{downward_acceleration} &8per tick, up to &a{terminal_fall_speed} &8blocks per tick.'
  enchantment-impact_coil-name: "Impact Coil"
  enchantment-impact_coil-description: '&8After a successful smash attack, gain &a{bounciness} &8bounciness and reduce fall damage by &a{fall_damage_reduction_percentage}% &8for &a{rebound_window_seconds} &8seconds.'
  enchantment-gale_impact-name: "Gale Impact"
  enchantment-gale_impact-description: '&8Smash after falling at least &a{minimum_fall_distance} &8blocks to hurl up to 16 nearby enemies within &a{burst_radius} &8blocks away with &a{knockback_force} &8force. Cooldown: &a{cooldown} &8seconds.'
  enchantment-tracking_arrow-name: "Tracking Arrow"
  enchantment-tracking_arrow-description: '&8Fired arrows track targets within &a{distance} &8blocks ahead.'
  enchantment-triple_shot-name: "Triple Shot"
  enchantment-triple_shot-description: '&8Consumes &a3 &8regular arrows per shot and fires &a3 &8arrows at once.'
  enchantment-triple_shot-no-arrows-message: '[actionbar]&6Triple Shot &7| &4Not enough arrows[/actionbar]'
  enchantment-frost_guard-name: "Frost Guard"
  enchantment-frost_guard-description: '&8Successful blocks have a &a{trigger_chance}% &8chance to inflict Slowness I on the attacker for &a{duration} &8seconds.'
  enchantment-instant_shield-name: "Instant Shield"
  enchantment-instant_shield-description: '&8Reduces the cooldown after a shield is disabled by &a50%&8.'
  enchantment-shadow_guard-name: "Shadow Guard"
  enchantment-shadow_guard-description: '&8Successful blocks have a &a20% &8chance to grant Speed II and Invisibility for 5 seconds.'
  enchantment-shield_might-name: "Shield Might"
  enchantment-shield_might-description: '&8Successful blocks have a &a{trigger_chance}% &8chance to grant Strength I for &a{duration} &8seconds.'
  enchantment-shield_preservation-name: "Shield Preservation"
  enchantment-shield_preservation-description: '&8When the shield is about to be disabled, has a &a{trigger_chance}% &8chance to prevent it.'
  enchantment-shield_rebound-name: "Shield Rebound"
  enchantment-shield_rebound-description: '&8When the shield is disabled, knocks the entity that disabled it away.'
  enchantment-shield_reflection-name: "Shield Reflection"
  enchantment-shield_reflection-description: '&8After a successful block, reflects &a{reflection_percentage}% &8of the blocked damage to the attacker.'
  enchantment-mirror_block-name: "Mirror Block"
  enchantment-mirror_block-description: '&8Successful projectile blocks have a &a{trigger_chance}% &8chance to send the projectile back at &a{reflected_velocity_percentage}% &8speed and &a{reflected_damage_percentage}% &8damage. Cooldown: &a{reflection_cooldown}s&8.'
  enchantment-perfect_guard-name: "Perfect Guard"
  enchantment-perfect_guard-description: '&8Perfect guards have a &a{trigger_chance}% &8chance to restore &a{repair_percentage}% &8of the shield''s maximum durability.'
  enchantment-perfect_guard-trigger-message: '[actionbar]&6Perfect Guard &7| &aRestored &f{repair_percentage}% &aof shield durability[/actionbar]'
  enchantment-sonic_rebound-name: "Sonic Rebound"
  enchantment-sonic_rebound-description: '&8After a successful block, has a &a{trigger_chance}% &8chance to unleash a sonic blast that deals &c{sonic_boom_damage} &8damage and knocks the attacker back.'
  enchantment-spear_point_blank-name: "Spear Point Blank"
  enchantment-spear_point_blank-description: '&8Spears deal &a{damage_increase_percentage}% &8more damage to targets within 3 blocks.'
  enchantment-sprint_assault-name: "Sprint Assault"
  enchantment-sprint_assault-description: '&8Deals &a{damage_increase_percentage}% &8more damage while sprinting.'
  enchantment-skewer_lock-name: "Skewer Lock"
  enchantment-skewer_lock-description: '&8Spear hits between &a3 &8and &a{sweet_max_distance} &8blocks pin the target with Slowness &a{slowness_level} &8for &a{slowness_duration_seconds} &8seconds. Per-target cooldown: &a2.5 &8seconds.'
  enchantment-skewer_lock-trigger-message: '[actionbar]&6Skewer Lock &7| &aTarget pinned for &f{slowness_duration_seconds} &aseconds[/actionbar]'
  enchantment-aqua_oxygen-name: "Aqua Oxygen"
  enchantment-aqua_oxygen-description: '&8Breaking a block underwater restores &a{oxygen} &8seconds of oxygen.'
  enchantment-auto_pickup-name: "Auto Pickup"
  enchantment-auto_pickup-description: '&8Drops from blocks mined with the correct tool go directly into your inventory; overflow still drops at the block.'
  enchantment-mob_pickup-name: "Loot Collector"
  enchantment-mob_pickup-description: '&8Drops from monsters you kill go directly into your inventory; overflow still drops at the monster.'
  enchantment-fishing_pickup-name: "Catch Collector"
  enchantment-fishing_pickup-description: '&8Items caught while fishing go directly into your inventory; overflow still drops at the hook.'
  enchantment-area_tilling-name: "Area Tilling"
  enchantment-area_tilling-description: '&8Right-clicking a tillable block with a hoe converts a centered &a{range}×{range} &8area into farmland.'
  enchantment-area_tilling-blocked-message: '[actionbar]&cSome blocks have obstructions above them and cannot be converted to farmland![/actionbar]'
  enchantment-axe_attack_speed-name: "Swift Swing"
  enchantment-axe_attack_speed-description: '&8Increases attack speed by &a{attack_speed} &8while holding an axe.'
  enchantment-block_reach-name: "Block Reach"
  enchantment-block_reach-description: '&8Increases block interaction range by &a{block_reach} &8blocks while holding a tool.'
  enchantment-block_rotator-name: "Block Rotator"
  enchantment-block_rotator-description: '&8Sneak and right-click a directional block to rotate it to the next available direction. Costs &a1 &8durability per use.'
  enchantment-crop_growth-name: "Crop Growth"
  enchantment-crop_growth-description: '&8Right-clicking a crop consumes one bone meal and grows crops in a centered &a{range}×{range} &8area by one stage.'
  enchantment-crop_growth-no-bone-meal-message: '[actionbar]&bCrop Growth &7| &4Not enough bone meal[/actionbar]'
  enchantment-cube_excavation-name: "Cube Excavation"
  enchantment-cube_excavation-description: '&8Breaking a block also breaks matching blocks in a surrounding cube with side length &a{side_length}&8; disabled while sneaking.'
  enchantment-entity_reach-name: "Entity Reach"
  enchantment-entity_reach-description: '&8Increases entity interaction range by &a{entity_reach} &8blocks while holding a tool or sword.'
  enchantment-farmland_hydration-name: "Farmland Hydration"
  enchantment-farmland_hydration-description: '&8Right-clicking farmland with a hoe fully hydrates farmland in a centered &a{range}×{range} &8area.'
  enchantment-copper_smelting-name: "Copper Smelting"
  enchantment-copper_smelting-description: '&8Mining copper ore with a pickaxe automatically smelts all block drops into copper ingots.'
  enchantment-gold_smelting-name: "Gold Smelting"
  enchantment-gold_smelting-description: '&8Mining gold ore with a pickaxe automatically smelts all block drops into gold ingots.'
  enchantment-iron_smelting-name: "Iron Smelting"
  enchantment-iron_smelting-description: '&8Mining iron ore with a pickaxe automatically smelts all block drops into iron ingots.'
  enchantment-layer_excavation-name: "Layer Excavation"
  enchantment-layer_excavation-description: '&8Breaking a block also breaks matching blocks in a &a{range}×{range} &8area on the same horizontal layer; disabled while sneaking.'
  enchantment-mass_harvest-name: "Mass Harvest"
  enchantment-mass_harvest-description: '&8Right-clicking a crop harvests mature crops in a centered &a{range}×{range} &8area. Costs &a1 &8durability per use.'
  enchantment-miner_rhythm-name: "Miner's Rhythm"
  enchantment-miner_rhythm-description: '&8Every &a10 &8blocks mined randomly grants Haste I or Mining Fatigue I for &a10 &8seconds.'
  enchantment-obsidian_haste-name: "Obsidian Haste"
  enchantment-obsidian_haste-description: '&8Grants Haste {haste_level} while breaking obsidian.'
  enchantment-plane_excavation-name: "Plane Excavation"
  enchantment-plane_excavation-description: '&8Breaking a block also breaks matching blocks in a &a{range}×{range} &8plane aligned with your view; disabled while sneaking.'
  enchantment-replant_crops-name: "Replant Crops"
  enchantment-replant_crops-description: '&8After breaking a mature crop, consumes the matching seed from your inventory to replant it and costs the tool &a1 &8durability.'
  enchantment-sphere_excavation-name: "Sphere Excavation"
  enchantment-sphere_excavation-description: '&8Breaking a block also breaks matching blocks in a surrounding sphere with radius &a{radius}&8; disabled while sneaking.'
  enchantment-stone_refining-name: "Stone Refining"
  enchantment-stone_refining-description: '&8Sneak and right-click waste stone to convert it into stone at a cost of &a1 &8durability.'
  enchantment-tunnel_excavation-name: "Tunnel Excavation"
  enchantment-tunnel_excavation-description: '&8Breaking a block excavates matching blocks along your view for &a{length} &8blocks with a &a{cross_section_size} &8wide cross-section; disabled while sneaking.'
  enchantment-vein_excavation-name: "Vein Excavation"
  enchantment-vein_excavation-description: '&8Breaking a block also breaks up to &a{amount} &8connected matching blocks; disabled while sneaking.'
  enchantment-axolotl_rescue-name: "Axolotl Rescue"
  enchantment-axolotl_rescue-description: '&8While in water at no more than 10% health, attacking a target can summon an axolotl nearby to assist you once every 30 seconds.'
  enchantment-fatigue_conversion-name: "Fatigue Conversion"
  enchantment-fatigue_conversion-description: '&8Gaining Mining Fatigue also grants Speed II and Strength I for the same duration.'
  enchantment-poison_cloud-name: "Poison Cloud"
  enchantment-poison_cloud-description: '&8Trident hits have a 25% chance to create a poison cloud near the target.'
  enchantment-storm_burst-name: "Storm Burst"
  enchantment-storm_burst-description: '&8Hits have a &a{trigger_chance}% &8chance to deal &a{lightning_damage} &8lightning damage near the target.'
  enchantment-tridal_hunter-name: "Tidal Hunter"
  enchantment-tridal_hunter-description: '&8Deals &a{bonus_damage} &8additional damage when attacking guardians or elder guardians, or while you are in water.'
  vanilla-enchantment-aqua_affinity-name: "Aqua Affinity"
  vanilla-enchantment-aqua_affinity-description: '&8Removes the underwater mining speed penalty.'
  vanilla-enchantment-bane_of_arthropods-name: "Bane of Arthropods"
  vanilla-enchantment-bane_of_arthropods-description: '&8Deals &a{damage} &8additional damage to arthropods and inflicts Slowness IV for &a1.5-{slowness_duration} &8seconds.'
  vanilla-enchantment-binding_curse-name: "Curse of Binding"
  vanilla-enchantment-binding_curse-description: '&8Prevents a worn item from being removed until it breaks or the player dies; Creative mode is unaffected.'
  vanilla-enchantment-blast_protection-name: "Blast Protection"
  vanilla-enchantment-blast_protection-description: '&8Reduces explosion damage by &a{damage_reduction}% &8and grants &a{knockback_reduction}% &8explosion knockback resistance; total enchantment protection is capped at &a80%&8.'
  vanilla-enchantment-breach-name: "Breach"
  vanilla-enchantment-breach-description: '&8Mace attacks reduce the effectiveness of the target armor by &a{armor_reduction}%&8.'
  vanilla-enchantment-channeling-name: "Channeling"
  vanilla-enchantment-channeling-description: '&8During thunderstorms, a thrown trident summons lightning when it hits an exposed entity or lightning rod.'
  vanilla-enchantment-density-name: "Density"
  vanilla-enchantment-density-description: '&8Mace smash attacks deal &a{damage_per_block} &8additional damage for each block fallen.'
  vanilla-enchantment-depth_strider-name: "Depth Strider"
  vanilla-enchantment-depth_strider-description: '&8Improves underwater movement efficiency by &a{underwater_efficiency}%&8; level III removes movement slowdown from flowing water.'
  vanilla-enchantment-efficiency-name: "Efficiency"
  vanilla-enchantment-efficiency-description: '&8Adds &a{mining_efficiency} &8mining efficiency when breaking blocks with the appropriate tool.'
  vanilla-enchantment-feather_falling-name: "Feather Falling"
  vanilla-enchantment-feather_falling-description: '&8Reduces fall damage by &a{damage_reduction}%&8; total enchantment protection is capped at &a80%&8.'
  vanilla-enchantment-fire_aspect-name: "Fire Aspect"
  vanilla-enchantment-fire_aspect-description: '&8Melee hits set the target on fire for &a{fire_duration} &8seconds.'
  vanilla-enchantment-fire_protection-name: "Fire Protection"
  vanilla-enchantment-fire_protection-description: '&8Reduces fire damage by &a{damage_reduction}% &8and burning duration by &a{fire_duration_reduction}%&8; total enchantment protection is capped at &a80%&8.'
  vanilla-enchantment-flame-name: "Flame"
  vanilla-enchantment-flame-description: '&8Ignites fired arrows, setting hit targets and interactable blocks on fire.'
  vanilla-enchantment-fortune-name: "Fortune"
  vanilla-enchantment-fortune-description: '&8Increases drop counts or bonus drop chances from certain blocks; the exact increase depends on the block loot table.'
  vanilla-enchantment-frost_walker-name: "Frost Walker"
  vanilla-enchantment-frost_walker-description: '&8While walking on the ground, freezes water within &a{freezing_radius} &8blocks beneath your feet into frosted ice and prevents magma block damage.'
  vanilla-enchantment-impaling-name: "Impaling"
  vanilla-enchantment-impaling-description: '&8Tridents deal &a{damage} &8additional damage to aquatic creatures.'
  vanilla-enchantment-infinity-name: "Infinity"
  vanilla-enchantment-infinity-description: '&8When an arrow hits, it has a &a{refund_chance}% &8chance to return one regular arrow. Levels I–IV require &c10/20/30/40 Combat&8 respectively and downgrade when the current requirement is not met.'
  vanilla-enchantment-knockback-name: "Knockback"
  vanilla-enchantment-knockback-description: '&8Melee hits gain &a{level} &8additional levels of knockback strength.'
  vanilla-enchantment-looting-name: "Looting"
  vanilla-enchantment-looting-description: '&8Increases normal mob drops and rare drop chances, and raises the chance for mob equipment to drop by &a{level}%&8.'
  vanilla-enchantment-loyalty-name: "Loyalty"
  vanilla-enchantment-loyalty-description: '&8Makes thrown tridents return automatically; higher levels increase return acceleration.'
  vanilla-enchantment-luck_of_the_sea-name: "Luck of the Sea"
  vanilla-enchantment-luck_of_the_sea-description: '&8Adds &a{level} &8luck while fishing, increasing treasure chances and reducing junk chances.'
  vanilla-enchantment-lunge-name: "Lunge"
  vanilla-enchantment-lunge-description: '&8Spear thrusts propel you forward with &a{thrust} &8impulse, cost &a1 &8durability, and add &a{exhaustion} &8exhaustion; unavailable while riding, gliding, in water, or below 7 hunger.'
  vanilla-enchantment-lure-name: "Lure"
  vanilla-enchantment-lure-description: '&8Reduces the wait for a bite by up to &a{time_reduction} &8seconds each time you fish.'
  vanilla-enchantment-mending-name: "Mending"
  vanilla-enchantment-mending-description: '&8When experience is collected, randomly repairs one equipped damaged enchanted item by &a2 &8durability per &a1 &8experience consumed.'
  vanilla-enchantment-multishot-name: "Multishot"
  vanilla-enchantment-multishot-description: '&8Crossbows fire &a3 &8projectiles spread 10° apart while consuming only &a1 &8piece of ammunition.'
  vanilla-enchantment-piercing-name: "Piercing"
  vanilla-enchantment-piercing-description: '&8Arrows can pass through entities and shields, hitting up to &a{hit_count} &8entities in sequence.'
  vanilla-enchantment-power-name: "Power"
  vanilla-enchantment-power-description: '&8Increases damage dealt by arrows fired from bows by &a{damage}&8.'
  vanilla-enchantment-projectile_protection-name: "Projectile Protection"
  vanilla-enchantment-projectile_protection-description: '&8Reduces projectile damage by &a{damage_reduction}%&8; total enchantment protection is capped at &a80%&8.'
  vanilla-enchantment-protection-name: "Protection"
  vanilla-enchantment-protection-description: '&8Reduces incoming attack damage by &a{damage}&8, up to a maximum of &a50%&8.'
  vanilla-enchantment-punch-name: "Punch"
  vanilla-enchantment-punch-description: '&8Arrows fired from bows gain &a{level} &8additional levels of knockback strength.'
  vanilla-enchantment-quick_charge-name: "Quick Charge"
  vanilla-enchantment-quick_charge-description: '&8Reduces crossbow loading time to &a{charge_time} &8seconds.'
  vanilla-enchantment-respiration-name: "Respiration"
  vanilla-enchantment-respiration-description: '&8Each air loss has a &a{oxygen_conservation_chance}% &8chance to preserve air, extending average underwater breathing time to &a{duration_multiplier} &8times normal.'
  vanilla-enchantment-riptide-name: "Riptide"
  vanilla-enchantment-riptide-description: '&8Using a trident in water or rain launches the player into a spinning charge with &a{riptide_strength} &8additional thrust strength.'
  vanilla-enchantment-sharpness-name: "Sharpness"
  vanilla-enchantment-sharpness-description: '&8Increases melee attack damage by &a{damage}&8.'
  vanilla-enchantment-silk_touch-name: "Silk Touch"
  vanilla-enchantment-silk_touch-description: '&8Makes applicable blocks drop themselves and prevents those blocks from dropping experience.'
  vanilla-enchantment-smite-name: "Smite"
  vanilla-enchantment-smite-description: '&8Deals &a{damage} &8additional damage to undead creatures.'
  vanilla-enchantment-soul_speed-name: "Soul Speed"
  vanilla-enchantment-soul_speed-description: '&8Removes slowdown and increases movement speed by &a{speed_increase}% &8on soul sand or soul soil; each block traveled has a &a{durability_loss_chance}% &8chance to cost 1 durability.'
  vanilla-enchantment-sweeping_edge-name: "Sweeping Edge"
  vanilla-enchantment-sweeping_edge-description: '&8Makes sweeping attacks deal &a{sweep_damage}% &8of the main target damage to nearby targets.'
  vanilla-enchantment-swift_sneak-name: "Swift Sneak"
  vanilla-enchantment-swift_sneak-description: '&8Increases sneaking speed to &a{sneak_speed}% &8of normal walking speed.'
  vanilla-enchantment-thorns-name: "Thorns"
  vanilla-enchantment-thorns-description: '&8When attacked, has a &a{trigger_chance}% &8chance to reflect 1-5 damage; triggering costs the enchanted item 2 additional durability.'
  vanilla-enchantment-unbreaking-name: "Unbreaking"
  vanilla-enchantment-unbreaking-description: '&8Non-armor items have a &a{tool_durability_conservation}% &8chance to preserve durability and last &a{durability_multiplier} &8times longer on average; armor has a &a{armor_durability_conservation}% &8preservation chance.'
  vanilla-enchantment-vanishing_curse-name: "Curse of Vanishing"
  vanilla-enchantment-vanishing_curse-description: '&8The item vanishes instead of dropping when the player dies; it does not trigger when keep inventory is enabled.'
  vanilla-enchantment-wind_burst-name: "Wind Burst"
  vanilla-enchantment-wind_burst-description: '&8A mace smash from at least 1.5 blocks high creates a wind burst that launches the attacker upward with a &a{knock_up_strength} &8knockback multiplier.'
