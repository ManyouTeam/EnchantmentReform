  skill-source-agility-fall-desc: '&7Take fall damage after dropping from a height.'
  skill-source-alchemy-potion: '&dDrink Potion'
  skill-source-alchemy-potion-desc: '&7Drink any consumable potion.'
  skill-source-alchemy-golden-apple: '&6Golden Apple'
  skill-source-alchemy-golden-apple-desc: '&7Eat a golden apple.'
  skill-source-alchemy-enchanted-apple: '&dEnchanted Golden Apple'
  skill-source-alchemy-enchanted-apple-desc: '&7Eat a rare enchanted golden apple.'
  skill-source-enchanting-weapon: '&cEnchant Weapon'
  skill-source-enchanting-weapon-desc: '&7Enchant a sword or axe at an enchanting table.'
  skill-source-enchanting-armor: '&9Enchant Armor'
  skill-source-enchanting-armor-desc: '&7Enchant armor at an enchanting table.'
  skill-source-enchanting-tool: '&bEnchant Tool'
  skill-source-enchanting-tool-desc: '&7Enchant a pickaxe, shovel, or hoe.'
  skill-source-enchanting-book: '&dEnchant Book'
  skill-source-enchanting-book-desc: '&7Enchant a book at an enchanting table.'
  skill-source-enchanting-misc: '&eEnchant Other Gear'
  skill-source-enchanting-misc-desc: '&7Enchant bows, rods, tridents, and special equipment.'
  custom-item-night_vision_helmet-name: "&eNight Vision Helmet"
  custom-item-night_vision_helmet-lore: '&7Grants night vision while worn.'
  custom-attribute-breathing-name: "&bSurface Breathing"
  custom-attribute-breathing-description: '&8Prevents air loss within &a{breathing_distance} blocks &8of a water or lava surface.'
  enchantment-air_dash-name: "Air Dash"
  enchantment-air_dash-description: '&8After a sprint-jump, left-click the air to dash horizontally in the look direction at &a{dash_force_display} blocks/second&8; the maximum level grants &a{max_charges} &8uses per jump, and each dash costs the leggings &a1 &8durability. Levels require &b10/20/30/40 Agility&8 respectively and downgrade when the current requirement is not met.'
  enchantment-air_dash-trigger-message: '[actionbar]&bAir Dash &8| &aDashed forward[/actionbar]'
  enchantment-charged_leap-name: "Charged Leap"
  enchantment-charged_leap-description: '&8Sneak-jump to leap approximately &a{jump_height} blocks &8high. Levels I–IV require &b10/20/30/40 Agility&8 respectively and downgrade when the current requirement is not met.'
  enchantment-charged_leap-trigger-message: '[actionbar]&6Charged Leap &8| &aEmpowered jump triggered[/actionbar]'
  custom-attribute-dodge-name: "&bDodge"
  custom-attribute-dodge-description: '&8With the matching enchantment, has a &a{melee_dodge_chance}% &8melee dodge chance and a &a{projectile_dodge_chance}% &8projectile dodge chance.'
  custom-attribute-endurance-name: "&bEndurance"
  custom-attribute-endurance-description: '&8Reduces exhaustion from sprinting and sprint-jumping by &a{exhaustion_reduction}&8.'
  custom-attribute-absorption-name: "&eAbsorption"
  custom-attribute-absorption-description: '&8Can hold up to &a{level} &8absorption layers. Each layer grants &e0.5 absorption hearts&8, for &e{absorption_hearts} hearts &8at full capacity. A source such as an enchantment must generate the layers.'
  enchantment-cleave-name: "Cleave"
  enchantment-cleave-description: '&8Axe attacks made at 90% attack cooldown deal &a{damage_percentage} &8of the primary hit damage to up to &a{target_cap} &8additional targets in a &a{arc_degrees}° &8frontal arc within &a{radius} blocks&8.'
  custom-attribute-sunder-name: "&6Sunder"
  custom-attribute-sunder-description: '&8Melee-weapon hits apply Sunder for &a{duration_seconds} seconds&8, stacking up to &a{max_stacks} times&8. Each stack removes &c{armor_shred_per_stack} armor &8and &c{toughness_shred_per_stack} armor toughness&8.'
  custom-attribute-potion_mastery-name: "&bPotion Mastery"
  custom-attribute-potion_mastery-description: '&8Extends beneficial effect durations by &a{beneficial_extension}% &8and shortens harmful effect durations by &a{harmful_reduction}%&8.'
  custom-attribute-work_speed-name: "&6Work Speed"
  custom-attribute-work_speed-description: '&8Advances active furnaces, smokers, blast furnaces, and brewing stands within &a{work_radius} blocks &8by an extra &a{extra_ticks} ticks &8each second.'
  enchantment-bark_hide-name: "Barkskin"
  enchantment-bark_hide-description: '&8Chopping logs with this axe generates &a1 &8Absorption layer, capped by the Absorption attribute. After you stop chopping for &a{grace_seconds} seconds&8, one layer expires every &a{decay_seconds} seconds&8.'
  enchantment-ore_guard-name: "Ore Guard"
  enchantment-ore_guard-description: '&8Mining ores with this pickaxe generates &a1 &8Absorption layer, capped by the Absorption attribute. After you stop mining for &a{grace_seconds} seconds&8, one layer expires every &a{decay_seconds} seconds&8.'
  skill-source-agility-projectile-dodge: '&bProjectile Dodge'
  skill-source-agility-projectile-dodge-desc: '&7Successfully dodge one projectile attack while sprinting.'
  enchantment-liquid_surface_breathing-name: "Surface Breathing"
  enchantment-liquid_surface_breathing-description: '&8Adds &a{breathing_distance} blocks &8of liquid-surface breathing distance while worn.'
  enchantment-lava_grace-name: "Lava Grace"
  enchantment-lava_grace-description: '&8Prevents lava damage for the first &a{immunity_seconds} seconds &8after entering lava.'
  enchantment-lingering_affliction-name: "Lingering Affliction"
  enchantment-lingering_affliction-description: '&8Attacking an enemy with harmful potion effects extends their remaining durations by &a{duration_increase_percentage}%&8.'
  enchantment-rotten_flesh_tolerance-name: "Rotten Flesh Tolerance"
  enchantment-rotten_flesh_tolerance-description: '&8Has a &a{trigger_chance}% &8chance to avoid Hunger when eating rotten flesh.'
  enchantment-experience_lifeblood-name: "Experience Lifeblood"
  enchantment-experience_lifeblood-description: '&8When below &a50% &8health, collected experience orbs automatically restore health; every accumulated &a3 &8experience restores &a1 &8health, up to &a50% &8of maximum health.'
  enchantment-threat_limit-name: "Threat Barrier"
  enchantment-threat_limit-description: '&8At most &a{max_threat_count} &8monsters may target you at the same time unless you attack them first.'
  enchantment-foolishness_curse-name: "Curse of Foolishness"
  enchantment-foolishness_curse-description: '&8This curse doubles the experience-level cost of the item in an anvil.'
  enchantment-firework_conservation-name: "Firework Conservation"
  enchantment-firework_conservation-description: '&8When a firework boosts your elytra, it has a &a{trigger_chance}% &8chance not to be consumed.'
  enchantment-kinetic_protection-name: "Kinetic Protection"
  enchantment-kinetic_protection-description: '&8Reduces kinetic damage from flying into a wall with an elytra by &a{damage_reduction}%&8.'
  enchantment-sprint_plating-name: "Sprint Plating"
  enchantment-sprint_plating-description: '&8Gradually gains up to &a{armor_bonus} armor &8while sprinting; the armor fades after sprinting stops.'
  enchantment-sprint_plating-charge-message: '[actionbar]&6Sprint Plating &8| &eArmor is charging[/actionbar]'
  enchantment-sprint_plating-charged-message: '[actionbar]&6Sprint Plating &8| &aArmor fully charged[/actionbar]'
  enchantment-sprint_plating-decay-message: '[actionbar]&6Sprint Plating &8| &cArmor is fading[/actionbar]'
  enchantment-sprint_plating-empty-message: '[actionbar]&6Sprint Plating &8| &7Armor bonus expired[/actionbar]'
  enchantment-emergency_repair-name: "Emergency Repair"
  enchantment-emergency_repair-description: '&8When the item is about to break, lowers this enchantment by &a1 &8level and restores &a{repair_percentage}% &8of its maximum durability.'
