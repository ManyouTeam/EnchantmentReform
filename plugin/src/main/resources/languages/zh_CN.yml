  enchantment-axe_attack_speed-name: "迅捷挥砍"
  enchantment-axe_attack_speed-description: '&8手持斧时增加 &a{attack_speed} &8点攻击速度。'
  enchantment-block_reach-name: "延伸触及"
  enchantment-block_reach-description: '&8手持工具时增加 &a{block_reach} &8格方块交互距离。'
  enchantment-block_rotator-name: "转向"
  enchantment-block_rotator-description: '&8潜行并右击具有朝向的方块时，将其切换到下一个可用方向。每次消耗 &a1 &8点耐久。'
  enchantment-crop_growth-name: "催生"
  enchantment-crop_growth-description: '&8右击作物时，消耗一个骨粉，使以目标为中心 &a{range}×{range} &8范围内的作物生长一个阶段。'
  enchantment-crop_growth-no-bone-meal-message: '[actionbar]&b催生 &7| &4骨粉不足[/actionbar]'
  enchantment-cube_excavation-name: "立方开采"
  enchantment-cube_excavation-description: '&8破坏方块时，额外破坏周围立方范围内的同类方块，边长为 &a{side_length}&8；潜行时停用。'
  enchantment-entity_reach-name: "长臂"
  enchantment-entity_reach-description: '&8手持工具或剑时增加 &a{entity_reach} &8格实体交互距离。'
  enchantment-farmland_hydration-name: "润土"
  enchantment-farmland_hydration-description: '&8用锄右击耕地时，使以目标为中心 &a{range}×{range} &8范围内的耕地达到最大湿度。'
  enchantment-copper_smelting-name: "炼铜"
  enchantment-copper_smelting-description: '&8使用镐挖掘铜矿石时，将全部方块掉落物自动熔炼为铜锭。'
  enchantment-gold_smelting-name: "熔金"
  enchantment-gold_smelting-description: '&8使用镐挖掘金矿石时，将全部方块掉落物自动熔炼为金锭。'
  enchantment-iron_smelting-name: "炼铁"
  enchantment-iron_smelting-description: '&8使用镐挖掘铁矿石时，将全部方块掉落物自动熔炼为铁锭。'
  enchantment-layer_excavation-name: "层状开采"
  enchantment-layer_excavation-description: '&8破坏方块时，额外破坏同一水平层内的同类方块，范围为 &a{range}×{range}&8；潜行时停用。'
  enchantment-mass_harvest-name: "丰收"
  enchantment-mass_harvest-description: '&8右击作物时，收获以目标为中心 &a{range}×{range} &8范围内的成熟作物。每次扣除 &a1 &8点耐久。'
  enchantment-miner_rhythm-name: "矿工节律"
  enchantment-miner_rhythm-description: '&8每挖掘 &a10 &8个方块，随机获得 &a10 &8秒急迫 I 或挖掘疲劳 I。'
  enchantment-obsidian_haste-name: "黑曜急迫"
  enchantment-obsidian_haste-description: '&8破坏黑曜石时获得急迫 {haste_level}。'
  enchantment-plane_excavation-name: "平面开采"
  enchantment-plane_excavation-description: '&8破坏方块时，额外破坏视线对应平面内的同类方块，范围为 &a{range}×{range}&8；潜行时停用。'
  enchantment-replant_crops-name: "作物补种"
  enchantment-replant_crops-description: '&8破坏成熟作物后消耗背包中的对应种子，在原地补种，并消耗 &a1 &8点工具耐久。'
  enchantment-sphere_excavation-name: "球形开采"
  enchantment-sphere_excavation-description: '&8破坏方块时，额外破坏周围球形范围内的同类方块，半径为 &a{radius}&8；潜行时停用。'
  enchantment-stone_refining-name: "石材精炼"
  enchantment-stone_refining-description: '&8潜行并右键废石时，将其转换为石头并消耗 &a1 &8点耐久。'
  enchantment-tunnel_excavation-name: "隧道开采"
  enchantment-tunnel_excavation-description: '&8破坏方块时，沿视线方向额外开凿同类方块，长度为 &a{length}&8、截面边长为 &a{cross_section_size}&8；潜行时停用。'
  enchantment-vein_excavation-name: "连锁开采"
  enchantment-vein_excavation-description: '&8破坏方块时，额外破坏最多 &a{amount} &8个相连的同类方块；潜行时停用。'
  enchantment-axolotl_rescue-name: "美西螈援军"
  enchantment-axolotl_rescue-description: '&8在水中且生命值不高于 10% 时攻击目标，每 30 秒可在目标附近召唤一只美西螈协助战斗。'
  enchantment-fatigue_conversion-name: "疲劳转化"
  enchantment-fatigue_conversion-description: '&8获得挖掘疲劳时，同时获得与其持续时间相同的速度 II 和力量 I。'
  enchantment-poison_cloud-name: "毒气云"
  enchantment-poison_cloud-description: '&8三叉戟命中敌人时有 25% 几率在目标附近生成毒气云。'
  enchantment-storm_burst-name: "雷霆爆发"
  enchantment-storm_burst-description: '&8攻击命中时有 &a{trigger_chance}% &8几率对目标附近造成 &a{lightning_damage} &8点闪电伤害。'
  enchantment-tridal_hunter-name: "潮汐猎手"
  enchantment-tridal_hunter-description: '&8攻击守卫者、远古守卫者，或你位于水中时，额外造成 &a{bonus_damage} &8点伤害。'
  vanilla-enchantment-aqua_affinity-name: "水下速掘"
  vanilla-enchantment-aqua_affinity-description: '&8消除水下挖掘速度惩罚。'
  vanilla-enchantment-bane_of_arthropods-name: "节肢杀手"
  vanilla-enchantment-bane_of_arthropods-description: '&8对节肢生物额外造成 &a{damage} &8点伤害，并施加 &a1.5-{slowness_duration} &8秒的缓慢 IV。'
  vanilla-enchantment-binding_curse-name: "绑定诅咒"
  vanilla-enchantment-binding_curse-description: '&8物品穿戴后无法取下，直至物品损坏或玩家死亡；创造模式不受限制。'
  vanilla-enchantment-blast_protection-name: "爆炸保护"
  vanilla-enchantment-blast_protection-description: '&8减少 &a{damage_reduction}% &8爆炸伤害，并提供 &a{knockback_reduction}% &8爆炸击退抗性；附魔保护总上限为 &a80%&8。'
  vanilla-enchantment-breach-name: "破甲"
  vanilla-enchantment-breach-description: '&8使用重锤攻击时降低目标 &a{armor_reduction}% &8的护甲防护效果。'
  vanilla-enchantment-channeling-name: "引雷"
  vanilla-enchantment-channeling-description: '&8雷暴期间，投掷的三叉戟命中露天实体或避雷针时召唤闪电。'
  vanilla-enchantment-density-name: "致密"
  vanilla-enchantment-density-description: '&8使用重锤发动重击时，每下落一格额外增加 &a{damage_per_block} &8点伤害。'
  vanilla-enchantment-depth_strider-name: "深海探索者"
  vanilla-enchantment-depth_strider-description: '&8提高 &a{underwater_efficiency}% &8水中移动效率；达到 III 级时消除水流造成的移动减速。'
  vanilla-enchantment-efficiency-name: "效率"
  vanilla-enchantment-efficiency-description: '&8使用合适工具挖掘方块时增加 &a{mining_efficiency} &8点挖掘效率。'
  vanilla-enchantment-feather_falling-name: "摔落缓冲"
  vanilla-enchantment-feather_falling-description: '&8减少 &a{damage_reduction}% &8摔落伤害；附魔保护总上限为 &a80%&8。'
  vanilla-enchantment-fire_aspect-name: "火焰附加"
  vanilla-enchantment-fire_aspect-description: '&8近战命中时使目标燃烧 &a{fire_duration} &8秒。'
  vanilla-enchantment-fire_protection-name: "火焰保护"
  vanilla-enchantment-fire_protection-description: '&8减少 &a{damage_reduction}% &8火焰伤害，并缩短 &a{fire_duration_reduction}% &8燃烧时间；附魔保护总上限为 &a80%&8。'
  vanilla-enchantment-flame-name: "火矢"
  vanilla-enchantment-flame-description: '&8使射出的箭矢燃烧，可点燃命中的目标及可交互方块。'
  vanilla-enchantment-fortune-name: "时运"
  vanilla-enchantment-fortune-description: '&8提高挖掘特定方块时的掉落数量或额外掉落概率，具体增幅由方块战利品表决定。'
  vanilla-enchantment-frost_walker-name: "冰霜行者"
  vanilla-enchantment-frost_walker-description: '&8在地面行走时，将脚下半径 &a{freezing_radius} &8格内的水面冻结成霜冰，并免疫岩浆块伤害。'
  vanilla-enchantment-impaling-name: "穿刺"
  vanilla-enchantment-impaling-description: '&8三叉戟对水生生物额外造成 &a{damage} &8点伤害。'
  vanilla-enchantment-infinity-name: "无限"
  vanilla-enchantment-infinity-description: '&8箭矢命中后有 &a{refund_chance}% &8概率返还一支普通箭。I–IV 级分别需要 &c10/20/30/40 级战斗&8，不满足当前等级时会降级生效。'
  vanilla-enchantment-knockback-name: "击退"
  vanilla-enchantment-knockback-description: '&8近战命中时额外增加 &a{level} &8级击退强度。'
  vanilla-enchantment-looting-name: "抢夺"
  vanilla-enchantment-looting-description: '&8提高生物常规掉落数量与稀有掉落概率，并使生物装备掉落概率增加 &a{level}%&8。'
  vanilla-enchantment-loyalty-name: "忠诚"
  vanilla-enchantment-loyalty-description: '&8使掷出的三叉戟自动返回；等级越高，返回加速度越大。'
  vanilla-enchantment-luck_of_the_sea-name: "海之眷顾"
  vanilla-enchantment-luck_of_the_sea-description: '&8钓鱼时增加 &a{level} &8点幸运值，提高宝藏概率并降低垃圾概率。'
  vanilla-enchantment-lunge-name: "突进"
  vanilla-enchantment-lunge-description: '&8持长矛突刺时以 &a{thrust} &8冲量向前突进，消耗 &a1 &8点耐久并增加 &a{exhaustion} &8点消耗度；骑乘、鞘翅滑翔、水中或饥饿值低于 7 时无法触发。'
  vanilla-enchantment-lure-name: "饵钓"
  vanilla-enchantment-lure-description: '&8每次钓鱼最多缩短 &a{time_reduction} &8秒等待咬钩时间。'
  vanilla-enchantment-mending-name: "经验修补"
  vanilla-enchantment-mending-description: '&8拾取经验时，随机选择一件已装备的受损附魔物品，每消耗 &a1 &8点经验修复 &a2 &8点耐久。'
  vanilla-enchantment-multishot-name: "多重射击"
  vanilla-enchantment-multishot-description: '&8弩一次向相差 10° 的方向射出 &a3 &8枚投射物，但只消耗 &a1 &8枚弹药。'
  vanilla-enchantment-piercing-name: "穿透"
  vanilla-enchantment-piercing-description: '&8弓箭或弩箭可穿透实体与盾牌，最多连续命中 &a{hit_count} &8个实体。'
  vanilla-enchantment-power-name: "力量"
  vanilla-enchantment-power-description: '&8使弓射出的箭矢伤害增加 &a{damage} &8点。'
  vanilla-enchantment-projectile_protection-name: "弹射物保护"
  vanilla-enchantment-projectile_protection-description: '&8减少 &a{damage_reduction}% &8弹射物伤害；附魔保护总上限为 &a80%&8。'
  vanilla-enchantment-protection-name: "保护"
  vanilla-enchantment-protection-description: '&8受到攻击减免 &a{damage} &8点伤害，最高减免 &a50%&8。'
  vanilla-enchantment-punch-name: "冲击"
  vanilla-enchantment-punch-description: '&8使弓射出的箭矢额外增加 &a{level} &8级击退强度。'
  vanilla-enchantment-quick_charge-name: "快速装填"
  vanilla-enchantment-quick_charge-description: '&8将弩的装填时间缩短至 &a{charge_time} &8秒。'
  vanilla-enchantment-respiration-name: "水下呼吸"
  vanilla-enchantment-respiration-description: '&8每次耗氧有 &a{oxygen_conservation_chance}% &8概率保留空气，使平均水下呼吸时间延长至 &a{duration_multiplier} &8倍。'
  vanilla-enchantment-riptide-name: "激流"
  vanilla-enchantment-riptide-description: '&8在水中或雨中使用三叉戟时，携带玩家旋转冲刺，并增加 &a{riptide_strength} &8点冲刺强度。'
  vanilla-enchantment-sharpness-name: "锋利"
  vanilla-enchantment-sharpness-description: '&8使近战攻击伤害增加 &a{damage} &8点。'
  vanilla-enchantment-silk_touch-name: "精准采集"
  vanilla-enchantment-silk_touch-description: '&8使适用方块掉落其本体，并阻止这些方块掉落经验。'
  vanilla-enchantment-smite-name: "亡灵杀手"
  vanilla-enchantment-smite-description: '&8对亡灵生物额外造成 &a{damage} &8点伤害。'
  vanilla-enchantment-soul_speed-name: "灵魂疾行"
  vanilla-enchantment-soul_speed-description: '&8在灵魂沙或灵魂土上移动时消除减速并提高 &a{speed_increase}% &8移动速度；每移动一格有 &a{durability_loss_chance}% &8概率损失 1 点耐久。'
  vanilla-enchantment-sweeping_edge-name: "横扫之刃"
  vanilla-enchantment-sweeping_edge-description: '&8使横扫攻击对附近目标造成主目标伤害的 &a{sweep_damage}%&8。'
  vanilla-enchantment-swift_sneak-name: "迅捷潜行"
  vanilla-enchantment-swift_sneak-description: '&8使潜行速度提高至正常行走速度的 &a{sneak_speed}%&8。'
  vanilla-enchantment-thorns-name: "荆棘"
  vanilla-enchantment-thorns-description: '&8受到攻击时有 &a{trigger_chance}% &8概率反弹 1-5 点伤害；触发时附魔物品额外损失 2 点耐久。'
  vanilla-enchantment-unbreaking-name: "耐久"
  vanilla-enchantment-unbreaking-description: '&8非盔甲物品有 &a{tool_durability_conservation}% &8概率不损失耐久，平均寿命为原来的 &a{durability_multiplier} &8倍；盔甲免耗概率为 &a{armor_durability_conservation}%&8。'
  vanilla-enchantment-vanishing_curse-name: "消失诅咒"
  vanilla-enchantment-vanishing_curse-description: '&8玩家死亡时物品不会掉落，而会直接消失；开启保留物品栏时不触发。'
  vanilla-enchantment-wind_burst-name: "风爆"
  vanilla-enchantment-wind_burst-description: '&8从至少 1.5 格高度发动重锤重击后产生风爆，以 &a{knock_up_strength} &8击退倍率将攻击者向上弹起。'
